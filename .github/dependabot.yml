version: 2

updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
    groups:
      aspnetcore:
        patterns:
          - "Microsoft.AspNetCore.*"
      entity-framework:
        patterns:
          - "Microsoft.EntityFrameworkCore.*"
      extensions:
        patterns:
          - "Microsoft.Extensions.*"
      testes:
        patterns:
          - "xunit*"
          - "Testcontainers.*"

  - package-ecosystem: npm
    directory: /src/frontend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
    groups:
      angular:
        patterns:
          - "@angular/*"
          - "angular-eslint"
      ferramentas:
        patterns:
          - "eslint*"
          - "@eslint/*"
          - "typescript-eslint"
          - "prettier"
          - "vitest"
          - "typescript"
    # Angular 22.1 aceita TypeScript >=6.0 <6.1 e Vitest ^4.0.8.
    # Remover estes limites quando uma versao adotada do Angular ampliar os peers.
    ignore:
      - dependency-name: "typescript"
        versions:
          - ">=6.1.0"
      - dependency-name: "vitest"
        versions:
          - ">=5.0.0"

  - package-ecosystem: npm
    directory: /tests/frontend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore"
    groups:
      playwright:
        patterns:
          - "@playwright/*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns:
          - "*"
