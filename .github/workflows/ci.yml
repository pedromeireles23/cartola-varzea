name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Segredos (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - name: Checkout com histórico completo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Instalar gitleaks com checksum verificado
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/${archive}" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version

      - name: Varrer histórico do Git
        run: '"$RUNNER_TEMP/gitleaks" git --redact --verbose --exit-code 1 .'

  editorconfig:
    name: Formatação (EditorConfig)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EC_VERSION: 4.0.1
      EC_SHA256: 90139c6ed52373c0acfc9deb2a07aa812e5184753afd4bc8252bf44eb4909155
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Instalar editorconfig-checker com checksum verificado
        run: |
          archive="editorconfig-checker-linux-amd64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$archive" "https://github.com/editorconfig-checker/editorconfig-checker/releases/download/v${EC_VERSION}/${archive}"
          echo "${EC_SHA256}  $RUNNER_TEMP/${archive}" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/ec"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/ec"
          install -m 0755 "$(find "$RUNNER_TEMP/ec" -type f -name editorconfig-checker | head -n 1)" "$RUNNER_TEMP/editorconfig-checker"
          "$RUNNER_TEMP/editorconfig-checker" --version

      - name: Verificar arquivos
        run: '"$RUNNER_TEMP/editorconfig-checker"'
