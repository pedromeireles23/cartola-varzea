name: Problema
description: Algo não funciona como deveria.
title: "[bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Não relate vulnerabilidades de segurança aqui. Use o canal privado descrito em SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: O que aconteceu?
      description: Descreva o comportamento observado.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: O que era esperado?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Como reproduzir
      placeholder: |
        1. Acesse ...
        2. Clique em ...
        3. Veja ...
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Ambiente
      placeholder: "Navegador, sistema, versão ou commit"
  - type: checkboxes
    id: data
    attributes:
      label: Dados
      options:
        - label: Não incluí senhas, tokens, e-mails ou dados pessoais reais nesta issue.
          required: true
