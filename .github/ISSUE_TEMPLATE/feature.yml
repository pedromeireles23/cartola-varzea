name: Sugestão
description: Proponha uma melhoria ou nova funcionalidade.
title: "[sugestão] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Qual problema isso resolve?
      description: Quem é afetado e em que situação.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposta
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Área
      options:
        - Público
        - Participante (mercado, escalação, ligas)
        - Organizador (campeonato, súmula, apuração)
        - Administração da plataforma
        - Infraestrutura e qualidade
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternativas consideradas
